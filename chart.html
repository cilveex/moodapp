<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="button.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="rating-page">
    <img src="../mood_app/Logo.png" alt="Logo" class="corner-logo">
    <nav>
        <span class="username">username</span>
        <div class="wrapper logout-wrapper">
            <button class="btn btn-small" onclick="logout()">LOGOUT</button>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper" style="text-align: center;">
            <h1>Ratings Chart</h1>
            <div id="chart-container">
                <canvas id="ratingChart"></canvas>
            </div>
        </div>
    </div>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script type="module">
        document.addEventListener("DOMContentLoaded", async () => {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-stq8yfrs282dqfe0.eu.auth0.com",
                clientId: "SEQvb4OwJaZKGttRAFIotZUmezz9BPmJ",
                authorizationParams: {
                    redirect_uri: "https://moodapp-five.vercel.app/main.html"
                }
            });

            const isAuthenticated = await auth0Client.isAuthenticated();
            if (!isAuthenticated) {
                await auth0Client.loginWithRedirect();
            }
        });

        // Auth0 Logout function
        window.logout = async function() {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-stq8yfrs282dqfe0.eu.auth0.com",
                clientId: "SEQvb4OwJaZKGttRAFIotZUmezz9BPmJ",
            });
            await auth0Client.logout({
                logoutParams: { returnTo: "https://moodapp-five.vercel.app" }
            });
        };

        // Fetch and Display Chart Data (replace with real API)
        async function displayChart() {
            const response = await fetch("https://moodapp-five.vercel.app/api/mood-ratings"); 
            const data = await response.json();
            const labels = ["Bad", "Okay", "Good", "Excellent"];
            const values = [data["1"] || 0, data["2"] || 0, data["3"] || 0, data["4"] || 0];

            const ctx = document.getElementById("ratingChart").getContext("2d");
            new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Ratings",
                        data: values,
                        backgroundColor: ["#e74c3c", "#f1c40f", "#3498db", "#2ecc71"],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        }
        displayChart();
    </script>
</body>
</html>
