<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myDAY - Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Your Mood Stats</h1>
        <div id="stats-graph">
            <!-- Stats graph for mood data will be displayed here -->
        </div>
        <button class="logout-button" onclick="logout()">LOGOUT</button>
    </div>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
    <script type="module">
        document.addEventListener("DOMContentLoaded", async () => {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-stq8yfrs282dqfe0.eu.auth0.com",
                clientId: "SEQvb4OwJaZKGttRAFIotZUmezz9BPmJ",
                authorizationParams: {
                    redirect_uri: "https://moodapp-five.vercel.app/main.html"
                }
            });

            const isAuthenticated = await auth0Client.isAuthenticated();
            if (!isAuthenticated) {
                await auth0Client.loginWithRedirect();
            }
        });

        // Auth0 Logout function
        window.logout = async function() {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-stq8yfrs282dqfe0.eu.auth0.com",
                clientId: "SEQvb4OwJaZKGttRAFIotZUmezz9BPmJ",
            });
            await auth0Client.logout({
                logoutParams: { returnTo: "https://moodapp-five.vercel.app" }
            });
        };
    </script>
</body>
</html>
