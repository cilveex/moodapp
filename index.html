<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myDAY - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="button.css">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
</head>
<body class="login-page">
    <div class="container">
        <div class="login-box">
            <div class="wrapper">
                <button class="btn" id="login-btn">
                    <div class="btn__bg">
                        <span class="btn__bg__layer btn__bg__layer-first"></span>
                        <span class="btn__bg__layer btn__bg__layer-second"></span>
                        <span class="btn__bg__layer btn__bg__layer-third"></span>
                    </div>
                    <span class="btn__text-out">LOGIN WITH GOOGLE</span>
                    <span class="btn__text-in">LOGIN WITH GOOGLE</span>
                </button>
                <button class="btn" id="logout-btn" style="display: none;">Logout</button>
            </div>
            <p id="status"></p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-stq8yfrs282dqfe0.eu.auth0.com",
                clientId: "SEQvb4OwJaZKGttRAFIotZUmezz9BPmJ",
                authorizationParams: {
                    redirect_uri: "https://moodapp-five.vercel.app/main.html"
                }
            });

            document.getElementById("login-btn").addEventListener("click", async () => {
                await auth0Client.loginWithRedirect();
            });

            document.getElementById("logout-btn").addEventListener("click", async () => {
                await auth0Client.logout({
                    logoutParams: { returnTo: "https://moodapp-five.vercel.app" }
                });
            });

            if (window.location.search.includes("code=")) {
                await auth0Client.handleRedirectCallback();
                window.history.replaceState({}, document.title, "/");
            }

            const isAuthenticated = await auth0Client.isAuthenticated();
            if (isAuthenticated) {
                const user = await auth0Client.getUser();
                document.getElementById("status").innerText = `Logged in as ${user.name}`;
                document.getElementById("login-btn").style.display = "none";
                document.getElementById("logout-btn").style.display = "block";
            } else {
                document.getElementById("status").innerText = "Not logged in!";
            }
        });
    </script>
</body>
</html>
